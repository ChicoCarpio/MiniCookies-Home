name: Sugerencia / Suggestion
description: Una mejora para una herramienta que ya existe. / An improvement to an existing tool.
title: "[Sugerencia] "
labels: ["enhancement"]
body:
  - type: input
    id: herramienta
    attributes:
      label: Herramienta / Tool
      description: Dejalo vacío si es una mejora para todo el sitio. / Leave empty if it's for the whole site.
  - type: textarea
    id: sugerencia
    attributes:
      label: Qué cambiarías / What you'd change
    validations:
      required: true
